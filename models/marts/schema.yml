version: 2

models:
  - name: dim_team
    description: Current team reference used for ownership and service area reporting.
    config:
      contract:
        enforced: true
    columns:
      - name: team_id
        data_type: varchar
        description: Stable team key.
        data_tests: [not_null, unique]
      - name: team_name
        data_type: varchar
        description: Team label used in reports.
      - name: reporting_unit
        data_type: varchar
        description: Management unit that owns the team.
      - name: service_area
        data_type: varchar
        description: Service area covered by the team.
      - name: team_lead
        data_type: varchar
        description: Synthetic accountable lead.
      - name: active_flag
        data_type: boolean
        description: Whether the team is active at the source reference date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: effective_from
        data_type: date
        description: First date for which the reference row applies.
      - name: effective_to
        data_type: date
        description: Final date for which the reference row applies, when present.

  - name: dim_service_category
    description: Service category reference used for workload and SLA analysis.
    config:
      contract:
        enforced: true
    columns:
      - name: category_id
        data_type: varchar
        description: Stable service category key.
        data_tests: [not_null, unique]
      - name: category_name
        data_type: varchar
        description: Category label used in reports.
      - name: service_group
        data_type: varchar
        description: Group used to compare related categories.
      - name: default_priority
        data_type: varchar
        description: Default priority before a case level override.
      - name: sla_eligible_flag
        data_type: boolean
        description: Whether the category is governed by an SLA.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: fact_service_event
    description: Ordered service event history at one row per event.
    config:
      materialized: incremental
      unique_key: event_id
      incremental_strategy: delete+insert
      on_schema_change: fail
      contract:
        enforced: true
    columns:
      - name: event_id
        data_type: varchar
        description: Stable event key.
        data_tests: [not_null, unique]
      - name: case_id
        data_type: varchar
        description: Case to which the event belongs.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_case_performance')
                field: case_id
      - name: event_at
        data_type: timestamp
        description: Time at which the event occurred.
        data_tests: [not_null]
      - name: event_type
        data_type: varchar
        description: Event classification.
      - name: from_status
        data_type: varchar
        description: Status before the event, when supplied.
      - name: to_status
        data_type: varchar
        description: Status after the event, when supplied.
      - name: team_id
        data_type: varchar
        description: Team responsible at the time of the event.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: event_sequence_number
        data_type: bigint
        description: Event order within the case, using event time and event key.
        data_tests: [not_null]
      - name: previous_event_type
        data_type: varchar
        description: Previous event in the case sequence.
      - name: next_event_type
        data_type: varchar
        description: Next event in the case sequence.
      - name: first_event_at
        data_type: timestamp
        description: Earliest event time observed for the case.
      - name: latest_event_at
        data_type: timestamp
        description: Latest event time observed for the case.
      - name: event_notes
        data_type: varchar
        description: Synthetic note attached to the event.

  - name: fact_case_performance
    description: Case lifecycle and SLA evidence at one row per case.
    config:
      contract:
        enforced: true
    columns:
      - name: case_id
        data_type: varchar
        description: Stable case key and table grain.
        data_tests: [not_null, unique]
      - name: case_reference
        data_type: varchar
        description: Synthetic case reference.
      - name: team_id
        data_type: varchar
        description: Team responsible for the case.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: category_id
        data_type: varchar
        description: Service category assigned to the case.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service_category')
                field: category_id
      - name: priority
        data_type: varchar
        description: Priority used to find the effective SLA target.
      - name: current_status
        data_type: varchar
        description: Case status as at the configured report date.
      - name: reporting_status
        data_type: varchar
        description: Reporting classification derived from case and measurement state.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - closed
                  - cancelled
                  - paused
                  - open_not_measured
                  - open_overdue
                  - open_within_sla
      - name: opened_at
        data_type: timestamp
        description: Time at which the case opened.
      - name: closed_at
        data_type: timestamp
        description: Time at which the case closed, when applicable.
      - name: sla_due_at
        data_type: timestamp
        description: Due time supplied for SLA assessment.
      - name: reporting_period
        data_type: date
        description: First day of the month in which the case opened.
      - name: report_date
        data_type: date
        description: Reproducible cutoff date used for age and overdue logic.
        data_tests: [not_null]
      - name: is_open_active
        data_type: boolean
        description: Whether the case is open or in progress.
      - name: is_paused
        data_type: boolean
        description: Whether the case is paused.
      - name: is_closed
        data_type: boolean
        description: Whether the case is closed.
      - name: is_cancelled
        data_type: boolean
        description: Whether the case is cancelled.
      - name: was_reopened
        data_type: boolean
        description: Whether the event history contains a reopen event.
      - name: was_paused
        data_type: boolean
        description: Whether the event history contains a pause event.
      - name: is_sla_eligible
        data_type: boolean
        description: Whether the category is governed by an SLA.
        data_tests: [not_null]
      - name: has_sla_due_at
        data_type: boolean
        description: Whether a due time is available for measurement.
        data_tests: [not_null]
      - name: has_matched_target
        data_type: boolean
        description: Whether an effective target matched category, priority, and open date.
        data_tests: [not_null]
      - name: sla_measurement_status
        data_type: varchar
        description: Reason the case is measured or excluded from the SLA rate.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [not_eligible, missing_due_date, missing_target, measured]
      - name: is_overdue
        data_type: boolean
        description: Whether active SLA work is past its due time at the report cutoff.
      - name: paused_past_sla_due
        data_type: boolean
        description: Whether paused SLA work is past its due time at the report cutoff.
      - name: sla_met_flag
        data_type: boolean
        description: Whether a closed, measured case met its due time.
      - name: target_id
        data_type: varchar
        description: Effective target matched to the case.
      - name: sla_hours
        data_type: integer
        description: Hours allowed by the matched target.
      - name: target_met_rate
        data_type: double
        description: Expected SLA rate in the matched target row.
      - name: cycle_time_days
        data_type: bigint
        description: Calendar days between open and close for closed cases.
      - name: age_days_at_report_date
        data_type: bigint
        description: Calendar days since opening for unresolved cases at the cutoff.

  - name: mart_service_performance
    description: Opened case cohort metrics by month, team, and category.
    config:
      contract:
        enforced: true
    columns:
      - name: reporting_period
        data_type: date
        description: First day of the case opening month.
        data_tests: [not_null]
      - name: report_date
        data_type: date
        description: Cutoff date shared by every row in the build.
        data_tests: [not_null]
      - name: team_id
        data_type: varchar
        description: Team key for the cohort row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: category_id
        data_type: varchar
        description: Service category key for the cohort row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service_category')
                field: category_id
      - name: case_count
        data_type: bigint
        description: Cases opened in the month, team, and category.
      - name: closed_case_count
        data_type: bigint
        description: Cohort cases closed by the report date.
      - name: open_case_count
        data_type: bigint
        description: Cohort cases still open or in progress at the report date.
      - name: overdue_open_case_count
        data_type: bigint
        description: Active cohort cases past their due time.
      - name: paused_case_count
        data_type: bigint
        description: Cohort cases paused at the report date.
      - name: reopened_case_count
        data_type: bigint
        description: Cohort cases with at least one reopen event.
      - name: sla_eligible_case_count
        data_type: bigint
        description: Cohort cases in categories governed by an SLA.
      - name: sla_measured_case_count
        data_type: bigint
        description: Eligible cohort cases with a due time and effective target.
      - name: closed_sla_measured_case_count
        data_type: bigint
        description: Closed measured cases used as the SLA rate denominator.
      - name: sla_met_case_count
        data_type: bigint
        description: Closed measured cases completed by their due time.
      - name: missing_sla_due_case_count
        data_type: bigint
        description: Eligible cases excluded because no due time is present.
      - name: missing_target_case_count
        data_type: bigint
        description: Eligible cases excluded because no effective target matched.
      - name: average_cycle_time_days
        data_type: double
        description: Mean calendar days to close for closed cohort cases.
      - name: median_cycle_time_days
        data_type: double
        description: Median calendar days to close for closed cohort cases.
      - name: average_open_age_days
        data_type: double
        description: Mean age of unresolved cohort cases at the cutoff.
      - name: average_sla_target_rate
        data_type: double
        description: Mean target rate for closed measured cases.
      - name: sla_met_rate
        data_type: double
        description: SLA met cases divided by closed measured cases.
      - name: overdue_open_rate
        data_type: double
        description: Overdue active cases divided by active open cases.
      - name: sla_target_variance
        data_type: double
        description: Actual SLA rate minus the average applicable target rate.
