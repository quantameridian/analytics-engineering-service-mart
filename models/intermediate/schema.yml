version: 2

models:
  - name: int_service_event_sequence
    description: Event-level sequence model used to reconstruct case lifecycle order.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: case_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cases')
                field: case_id
      - name: event_sequence_number
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["created", "assigned", "status_change", "paused", "reopened", "closed", "cancelled"]

  - name: int_case_lifecycle
    description: Case-level lifecycle model with derived status, reopened, paused, age, and cycle-time fields.
    columns:
      - name: case_id
        tests:
          - not_null
          - unique
      - name: current_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["open", "in_progress", "paused", "closed", "cancelled"]
      - name: event_count
        tests:
          - not_null

  - name: int_service_sla_status
    description: Case-level SLA and reporting-status classification model.
    columns:
      - name: case_id
        tests:
          - not_null
          - unique
      - name: is_sla_eligible
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_overdue
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: reporting_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - closed
                  - cancelled
                  - paused
                  - open_not_measured
                  - open_overdue
                  - open_within_sla
      - name: sla_measurement_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [not_eligible, missing_due_date, missing_target, measured]

unit_tests:
  - name: classify_sla_measurement_edges
    description: Separates eligibility, missing inputs, and measured SLA outcomes.
    model: int_service_sla_status
    overrides:
      vars:
        report_date: "2026-06-19"
    given:
      - input: ref('int_case_lifecycle')
        rows:
          - {case_id: C1, case_reference: REF1, team_id: T1, category_id: CAT1, priority: high, current_status: closed, opened_at: '2026-05-15 09:00:00', closed_at: '2026-06-09 10:00:00', sla_due_at: '2026-06-10 09:00:00', reporting_period: '2026-05-01', report_date: '2026-06-19', is_open_active: false, is_paused: false, is_closed: true, is_cancelled: false, was_reopened: false, was_paused: false, cycle_time_days: 25, age_days_at_report_date: null}
          - {case_id: C2, case_reference: REF2, team_id: T1, category_id: CAT1, priority: high, current_status: open, opened_at: '2026-05-20 09:00:00', closed_at: null, sla_due_at: null, reporting_period: '2026-05-01', report_date: '2026-06-19', is_open_active: true, is_paused: false, is_closed: false, is_cancelled: false, was_reopened: false, was_paused: false, cycle_time_days: null, age_days_at_report_date: 30}
          - {case_id: C3, case_reference: REF3, team_id: T1, category_id: CAT2, priority: low, current_status: open, opened_at: '2026-05-20 09:00:00', closed_at: null, sla_due_at: null, reporting_period: '2026-05-01', report_date: '2026-06-19', is_open_active: true, is_paused: false, is_closed: false, is_cancelled: false, was_reopened: false, was_paused: false, cycle_time_days: null, age_days_at_report_date: 30}
          - {case_id: C4, case_reference: REF4, team_id: T1, category_id: CAT1, priority: high, current_status: closed, opened_at: '2026-06-05 09:00:00', closed_at: '2026-06-08 09:00:00', sla_due_at: '2026-06-10 09:00:00', reporting_period: '2026-06-01', report_date: '2026-06-19', is_open_active: false, is_paused: false, is_closed: true, is_cancelled: false, was_reopened: false, was_paused: false, cycle_time_days: 3, age_days_at_report_date: null}
          - {case_id: C5, case_reference: REF5, team_id: T1, category_id: CAT1, priority: high, current_status: open, opened_at: '2026-06-10 09:00:00', closed_at: null, sla_due_at: '2026-06-12 09:00:00', reporting_period: '2026-06-01', report_date: '2026-06-19', is_open_active: true, is_paused: false, is_closed: false, is_cancelled: false, was_reopened: false, was_paused: false, cycle_time_days: null, age_days_at_report_date: 9}
      - input: ref('stg_case_categories')
        rows:
          - {category_id: CAT1, sla_eligible_flag: true}
          - {category_id: CAT2, sla_eligible_flag: false}
      - input: ref('stg_targets')
        rows:
          - {target_id: TG1, category_id: CAT1, priority: high, sla_hours: 24, target_met_rate: 0.9, active_from: '2026-01-01', active_to: '2026-05-31'}
    expect:
      rows:
        - {case_id: C1, is_sla_eligible: true, has_sla_due_at: true, has_matched_target: true, sla_measurement_status: measured, is_overdue: false, sla_met_flag: true, reporting_status: closed}
        - {case_id: C2, is_sla_eligible: true, has_sla_due_at: false, has_matched_target: true, sla_measurement_status: missing_due_date, is_overdue: false, sla_met_flag: null, reporting_status: open_not_measured}
        - {case_id: C3, is_sla_eligible: false, has_sla_due_at: false, has_matched_target: false, sla_measurement_status: not_eligible, is_overdue: false, sla_met_flag: null, reporting_status: open_not_measured}
        - {case_id: C4, is_sla_eligible: true, has_sla_due_at: true, has_matched_target: false, sla_measurement_status: missing_target, is_overdue: false, sla_met_flag: null, reporting_status: closed}
        - {case_id: C5, is_sla_eligible: true, has_sla_due_at: true, has_matched_target: false, sla_measurement_status: missing_target, is_overdue: true, sla_met_flag: null, reporting_status: open_overdue}
