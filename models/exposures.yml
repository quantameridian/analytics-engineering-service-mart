version: 2

exposures:
  - name: service_performance_management_pack
    label: Service Performance Management Pack
    type: dashboard
    maturity: medium
    description: >
      Reference management view over the tested cohort mart. It uses the
      published workload, overdue, SLA, and cycle time measures without
      rebuilding them in a reporting tool.
    depends_on:
      - ref('mart_service_performance')
      - ref('dim_team')
      - ref('dim_service_category')
    owner:
      name: Reporting Lead
      email: reporting-lead@example.com

  - name: service_performance_drillthrough_dataset
    label: Service Performance Drillthrough Dataset
    type: application
    maturity: medium
    description: >
      Reference detail view for case investigation and lifecycle audit. It
      depends on the case and event facts so that operational logic remains in
      the governed dbt models.
    depends_on:
      - ref('fact_case_performance')
      - ref('fact_service_event')
      - ref('dim_team')
      - ref('dim_service_category')
    owner:
      name: Analytics Engineering Owner
      email: analytics-owner@example.com
