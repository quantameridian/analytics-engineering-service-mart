[project]
name = "analytics-engineering-service-mart"
version = "0.2.0"
description = "A tested dbt service mart for workload, lifecycle, and SLA reporting."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "dbt-core==1.11.13",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
    "pip-audit==2.10.1",
    "PyYAML==6.0.3",
    "ruff==0.16.5",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
