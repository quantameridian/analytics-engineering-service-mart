name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install PYTHON=python

      - name: Show dbt version
        run: dbt --version

      - name: Audit Python dependencies
        run: make audit PYTHON=python

      - name: Run the full quality gate
        run: make qa PYTHON=python DBT=dbt PROFILES_DIR=.

      - name: Upload review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-mart-build-evidence
          path: |
            target/manifest.json
            target/catalog.json
            target/run_results.json
            docs/mart-output-preview.md
            docs/build-evidence.md
          if-no-files-found: error
          retention-days: 7
