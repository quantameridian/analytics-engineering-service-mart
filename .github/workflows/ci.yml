name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install PYTHON=python

      - name: Show dbt version
        run: dbt --version

      - name: Audit Python dependencies
        run: make audit PYTHON=python

      - name: Run the full quality gate
        run: make qa PYTHON=python DBT=dbt PROFILES_DIR=.

      - name: Upload review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-mart-build-evidence
          path: |
            target/manifest.json
            target/catalog.json
            target/run_results.json
            docs/mart-output-preview.md
            docs/build-evidence.md
          if-no-files-found: error
          retention-days: 7
